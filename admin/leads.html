<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — RoyceAI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg-card:#111;--text:#f5f5f5;--text-secondary:#a1a1aa;--border:rgba(255,255,255,0.06);--accent:#667eea;--green:#22c55e;--gold:#eab308;--red:#ef4444;--font:'Inter',system-ui,-apple-system,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:24px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text-secondary);font-size:.8rem;margin-bottom:20px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:120px}
.stat .num{font-size:1.5rem;font-weight:800}
.stat .lbl{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;background:var(--bg-card);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);padding:10px 14px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,0.03)}
tr:hover td{background:rgba(102,126,234,0.04)}
.badge{padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600}
.badge-new{background:rgba(102,126,234,0.15);color:var(--accent)}
.badge-hot{background:rgba(34,197,94,0.15);color:var(--green)}
.badge-repeat{background:rgba(234,179,8,0.15);color:var(--gold)}
.empty{text-align:center;padding:40px;color:var(--text-secondary)}
.refresh{text-align:center;margin-top:16px;font-size:.7rem;color:var(--text-secondary)}
</style>
</head>
<body>
<h1>📋 Inquiries</h1>
<p class="sub" id="subtitle">Loading...</p>
<div class="stats" id="stats"></div>
<div id="tableWrap"></div>
<p class="refresh" id="freshness"></p>
<script>
async function load() {
  try {
    var r = await fetch('https://chat-api-tawny-zeta.vercel.app/api/lead?_='+Date.now());
    var d = await r.json();
    var leads = d.leads || [];
    var subtitle = document.getElementById('subtitle');
    subtitle.textContent = leads.length + ' total inquiries';
    
    // Stats
    var newC = leads.filter(l => l.status === 'new').length;
    var todayC = leads.filter(l => l.timestamp && l.timestamp.slice(0,10) === new Date().toISOString().slice(0,10)).length;
    var repC = leads.filter(l => l.repeat).length;
    document.getElementById('stats').innerHTML = 
      '<div class="stat"><div class="num" style="color:var(--accent)">'+leads.length+'</div><div class="lbl">Total</div></div>' +
      '<div class="stat"><div class="num" style="color:var(--gold)">'+todayC+'</div><div class="lbl">Today</div></div>' +
      '<div class="stat"><div class="num" style="color:var(--green)">'+newC+'</div><div class="lbl">New</div></div>' +
      '<div class="stat"><div class="num" style="color:var(--text)">'+repC+'</div><div class="lbl">Repeat</div></div>';
    
    if (!leads.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">No inquiries yet. They will appear here when someone fills out the chat form.</div>';
    } else {
      document.getElementById('tableWrap').innerHTML = 
        '<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Date</th><th>Status</th></tr></thead><tbody>' +
        leads.slice().reverse().map(function(l) {
          var badge = l.repeat ? 'badge-repeat' : (l.qualified ? 'badge-hot' : 'badge-new');
          var label = l.repeat ? 'Repeat' : (l.qualified ? 'Qualified' : 'New');
          var date = l.timestamp ? l.timestamp.slice(0, 10) : '—';
          return '<tr><td><strong>'+l.name+'</strong></td><td>'+l.email+'</td><td>'+l.phone+'</td><td>'+date+'</td><td><span class="badge '+badge+'">'+label+'</span></td></tr>';
        }).join('') + '</tbody></table>';
    }
    document.getElementById('freshness').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">Could not load leads. API may be cold-starting — try again in a moment.</div>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
