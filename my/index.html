<style>
:root{--bg:#0a0a0a;--bg-card:#111;--text:#f5f5f5;--text-secondary:#a1a1aa;--border:rgba(255,255,255,0.06);--accent:#667eea;--radius:16px;--font:Inter,system-ui,sans-serif;--max-w:1000px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}
nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;height:64px;max-width:var(--max-w);margin:0 auto;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.85);backdrop-filter:blur(16px);position:fixed;top:0;left:0;right:0;z-index:100}
.nav-logo{font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:8px}
.nav-links a{color:var(--text-secondary);text-decoration:none;font-size:0.875rem;padding:6px 14px;border-radius:8px}
.nav-links a:hover{color:var(--text);background:rgba(102,126,234,0.08)}
.nav-links .nav-cta{background:var(--accent);color:white!important;font-weight:600;padding:8px 20px;border-radius:8px}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 1px #667eea,0 4px 20px rgba(102,126,234,0.2)}50%{box-shadow:0 0 0 1px #667eea,0 4px 40px rgba(102,126,234,0.2),0 0 60px rgba(102,126,234,0.2)}}
.hero{padding:120px 24px 40px;max-width:var(--max-w);margin:0 auto;text-align:center}
.hero h1{font-size:2rem;font-weight:800}
.hero .sub{color:var(--text-secondary);font-size:0.9rem;margin-top:8px}
.dashboard{max-width:var(--max-w);margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;text-decoration:none;color:inherit;transition:all .2s}
.card:hover{border-color:rgba(102,126,234,0.3);transform:translateY(-2px)}
.card .icon{font-size:2rem;margin-bottom:12px;display:block}
.card h3{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.card p{color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px}
.card .status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:0.75rem;font-weight:600;background:rgba(34,197,94,0.1);color:#22c55e}
.login-screen{max-width:360px;margin:80px auto;padding:40px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);text-align:center}
.login-screen h2{font-size:1.2rem;margin-bottom:20px}
.login-screen input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--border);border-radius:8px;background:#1a1a1a;color:#fff;font-size:0.9rem}
.login-screen label{font-size:0.8rem;color:var(--text-secondary);display:block;text-align:left}
.login-screen .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:white;font-weight:600;font-size:0.9rem;cursor:pointer}
.login-screen .error{color:#ef4444;font-size:0.8rem;margin-top:8px;display:none}
footer{border-top:1px solid var(--border);padding:36px 24px;max-width:var(--max-w);margin:0 auto;text-align:center;color:var(--text-secondary);font-size:0.85rem}




/* ===== HAMBURGER NAV (neat all-widths) ===== */
.nav-burger{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:42px;height:42px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;cursor:pointer;margin-left:8px;padding:0;flex:none;position:relative;z-index:1002}
.nav-burger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px;transition:all .25s cubic-bezier(.16,1,.3,1)}
.nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-burger.open span:nth-child(2){opacity:0}
.nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);background:rgba(14,14,18,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border);padding:calc(var(--nav-h) + 16px) 16px 30px;display:flex;flex-direction:column;gap:2px;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:1000;overflow-y:auto}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu a{color:var(--text-secondary);text-decoration:none;font-size:1rem;font-weight:500;padding:12px 14px;border-radius:10px;transition:all .2s}
.mobile-menu a:hover,.mobile-menu a.active{color:var(--text);background:var(--accent-bg)}
.mobile-menu .nav-cta{background:var(--accent);color:#fff!important;font-weight:600;margin-top:10px;text-align:center;animation:pulse-glow 2.5s ease-in-out infinite}
.mobile-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
.mobile-menu-backdrop.open{opacity:1;pointer-events:auto}
@media(max-width:1099px){
  nav{z-index:1001;flex-direction:row;flex-wrap:nowrap;height:var(--nav-h);background:var(--bg)}
  .nav-links{width:auto;margin-left:auto;justify-content:flex-end}
  .nav-links a:not(.nav-cta):not(.nav-show-mobile){display:none!important}
  .nav-logo{width:auto;justify-content:flex-start}
}
@media(min-width:1100px){
  .nav-links a.nav-drawer-only{display:none!important}
  #navLoginBtn{display:none!important}
}

/* desktop: full row, no burger; hide duplicate LogIn button (Tutor covers /tutor) */
@media(min-width:1100px){
  #navLoginBtn{display:none!important}
}




html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
section[id],div[id]{scroll-margin-top:80px}


/* ===== SITE DECK (LivAway pattern) — ALL WIDTHS, consistent ===== */
html{overflow-x:clip}
body{overflow-x:clip}.deck-progress{position:fixed;top:var(--nav-h);left:0;right:0;height:3px;background:rgba(255,255,255,0.05);z-index:90}
.deck-progress-bar{height:100%;width:0%;background:var(--accent-gradient);transition:width .3s ease}
.slide{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;display:flex;padding:calc(var(--nav-h) + 28px) 24px 92px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;transform:translateY(24px) scale(0.992);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1),visibility .5s;z-index:1}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}
.slide-inner{width:100%;max-width:920px;margin:auto}
.deck-controls{position:fixed;right:22px;bottom:22px;display:flex;align-items:center;gap:10px;z-index:80}
.dc-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:rgba(14,14,18,0.85);backdrop-filter:blur(12px);color:var(--text);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:var(--shadow-card)}
.dc-btn:hover{border-color:var(--accent);color:var(--accent-light);transform:translateY(-2px)}
.dc-counter{font-size:0.8rem;font-weight:600;color:var(--text-muted);background:rgba(14,14,18,0.85);backdrop-filter:blur(12px);border:1px solid var(--border);padding:8px 14px;border-radius:100px;letter-spacing:0.05em}
.dc-dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:80}
.dc-dot{width:9px;height:9px;border-radius:100px;background:rgba(255,255,255,0.15);border:none;cursor:pointer;padding:0;transition:all .25s}
.dc-dot.active{background:var(--accent);height:26px}
@media(max-width:640px){.dc-dots{right:12px}.deck-controls{right:14px;bottom:14px}.dc-btn{width:40px;height:40px}}
@media(max-width:1099px){footer{display:none!important}}


/* ===== SITE DECK (single-slide mode) — static hero, no fixed overlay ===== */
body.deck-single .slide{position:static;top:auto;left:auto;right:auto;bottom:auto;height:auto;display:block;padding:calc(var(--nav-h,64px) + 24px) 24px 48px;overflow:visible;opacity:1;visibility:visible;transform:none;transition:none;z-index:auto}
body.deck-single .slide.active{transform:none;z-index:auto}
body.deck-single .slide.hero{padding:3.5rem 1.5rem 1.5rem}
body.deck-single .slide-inner{width:100%;max-width:920px;margin:0 auto}
body.deck-single .deck-controls,body.deck-single .dc-dots,body.deck-single .deck-progress{display:none!important}

</style>
</head>

<script>
// === USER DATA (embedded) ===
var usersData = [];
var currentUser = null;

// === BADGE ===
function updateNavBadge() {
  try {
    var u = JSON.parse(localStorage.getItem("tutor_user"));
    var nav = document.getElementById("navLinks");
    var e = document.getElementById("userBadge");
    if (e) e.remove();
    if (u && u.first && nav) {
      var b = document.createElement("span");
      b.id = "userBadge";
      b.style.cssText = "display:inline-flex;align-items:center;gap:6px;padding:4px 14px 4px 10px;border-radius:20px;background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12));border:1px solid rgba(102,126,234,0.25);font-size:0.8rem;font-weight:600;color:#f5f5f5";
      var i = document.createElement("span");
      i.style.cssText = "width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:800;color:white";
      i.textContent = (u.first[0]||"") + (u.last ? u.last[0] : "").toUpperCase();
      var n = document.createElement("span");
      n.textContent = u.first;
      b.appendChild(i);
      b.appendChild(n);
      nav.insertBefore(b, nav.firstChild);
    }
  } catch(e) {}
}

function fetchUsers() {
  return fetch("https://raw.githubusercontent.com/royceAIsolutions/royceAIsolutions.github.io/main/tutor/users.json?_=" + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(d) { usersData = d; });
}

function showDashboard(u) {
  document.getElementById("greeting").textContent = "Welcome back, " + u.first;
  var products = u.products || ["tutor"];
  var container = document.getElementById("content");
  var html = "<div class='dashboard'>";
  products.forEach(function(p) {
    if (p === "tutor") {
      html += "<a href='/tutor' class='card'><span class='icon'>🧠</span><h3>AI Tutor</h3><p>" + (u.subjects || "All subjects") + "</p><span class='status'>Active</span></a>";
    }
    if (p === "therapy") {
      html += "<a href='/therapy' class='card'><span class='icon'>🧠</span><h3>Therapy Bot</h3><p>24/7 mental wellness support</p><span class='status'>Active</span></a>";
    }
  });
  html += "</div>";
  container.innerHTML = html;
  updateNavBadge();
}

function showLogin() {
  document.getElementById("content").innerHTML = 
    "<div class='login-screen'><h2>Sign In</h2><label>First Name</label><input type='text' id='fn' placeholder='First name'><label>Last Name</label><input type='text' id='ln' placeholder='Last name'><button class='btn' onclick='login()'>Log in →</button><div class='error' id='loginError'></div></div>";
}

function login() {
  var fn = document.getElementById("fn").value.trim().toLowerCase();
  var ln = document.getElementById("ln").value.trim().toLowerCase();
  var er = document.getElementById("loginError");
  if (!fn) { er.textContent = "Enter your first name."; er.style.display = "block"; return; }
  var id = fn + " " + ln;
  var u = usersData.find(function(x) { return x.id === id; });
  if (!u) {
    er.textContent = "Name not found: " + id;
    er.style.display = "block";
    return;
  }
  currentUser = u;
  localStorage.setItem("tutor_user", JSON.stringify(u));
  showDashboard(u);
}

function logout() {
  localStorage.removeItem("tutor_user");
  currentUser = null;
  location.reload();
}

// === INIT ===
fetchUsers().then(function() {
  var saved = JSON.parse(localStorage.getItem("tutor_user"));
  if (saved) {
    var match = usersData.find(function(x) { return x.id === saved.id; });
    if (match) { currentUser = match; showDashboard(match); }
    else { showLogin(); }
  } else {
    showLogin();
  }
  updateNavBadge();
});
</script>

<script>
(function(){
  function initMobileMenu(){
    var burger=document.getElementById('navBurger');
    if(!burger||document.getElementById('mobileMenu').dataset.mnInit)return;
    var menu=document.getElementById('mobileMenu');
    var backdrop=document.getElementById('mobileMenuBackdrop');
    var links=document.querySelector('.nav-links');
    if(menu.children.length===0&&links){
      links.querySelectorAll('a:not(.nav-cta)').forEach(function(a){menu.appendChild(a.cloneNode(true));});
    }
    var p=location.pathname;
    if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);
    menu.querySelectorAll('a').forEach(function(a){
      var h=a.getAttribute('href')||'';
      h=h.split('?')[0].split('#')[0];
      if(h.length>1&&h.endsWith('/'))h=h.slice(0,-1);
      if(h==='/'?p==='/':p.indexOf(h)===0)a.classList.add('active');
    });
    function open(){menu.classList.add('open');backdrop.classList.add('open');burger.classList.add('open');burger.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}
    function close(){menu.classList.remove('open');backdrop.classList.remove('open');burger.classList.remove('open');burger.setAttribute('aria-expanded','false');document.body.style.overflow='';}
    burger.addEventListener('click',function(){menu.classList.contains('open')?close():open();});
    backdrop.addEventListener('click',close);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});
    menu.dataset.mnInit='1';
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initMobileMenu);}else{initMobileMenu();}
})();
</script>


<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  if(slides.length<2)return;
  var counter=document.getElementById('dcCounter');
  var bar=document.getElementById('deckProgressBar');
  var dotsWrap=document.getElementById('dcDots');
  var current=0;

  slides.forEach(function(s,i){
    var d=document.createElement('button');
    d.className='dc-dot'+(i===0?' active':'');
    d.setAttribute('aria-label','Slide '+(i+1));
    d.addEventListener('click',function(){go(i);});
    dotsWrap.appendChild(d);
  });
  var dots=[].slice.call(dotsWrap.children);

  function go(i){
    if(i<0||i>=slides.length)return;
    current=i;
    slides.forEach(function(s,j){s.classList.toggle('active',j===i);});
    counter.textContent=(i+1)+' / '+slides.length;
    dots.forEach(function(d,j){d.classList.toggle('active',j===i);});
    bar.style.width=((i+1)/slides.length*100)+'%';
    var active=slides[i];
    if(active.scrollTop)active.scrollTop=0;
    active.querySelectorAll('.reveal, .reveal-stagger').forEach(function(el){
      el.classList.add('visible');
    });
  }
  document.getElementById('dcNext').addEventListener('click',function(){go(current+1);});
  document.getElementById('dcPrev').addEventListener('click',function(){go(current-1);});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1);}
    if(e.key==='Home'){e.preventDefault();go(0);}
    if(e.key==='End'){e.preventDefault();go(slides.length-1);}
    if(e.key===' '&&e.target===document.body){e.preventDefault();go(current+1);}
  });
  var lastWheel=0;
  window.addEventListener('wheel',function(e){
    var now=Date.now();
    if(now-lastWheel<800)return;
    if(Math.abs(e.deltaY)<8)return;
    var active=slides[current];
    var canScroll=active.scrollHeight>active.clientHeight+4;
    var atTop=active.scrollTop<=2;
    var atBottom=active.scrollTop+active.clientHeight>=active.scrollHeight-2;
    if(canScroll){
      if(e.deltaY>0&&!atBottom)return;
      if(e.deltaY<0&&!atTop)return;
    }
    if(e.deltaY>0){go(current+1);}else{go(current-1);}
    lastWheel=now;
  },{passive:true});
  var tsx=null,tsy=null;
  document.addEventListener('touchstart',function(e){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(tsx===null)return;
    var dx=e.changedTouches[0].clientX-tsx;
    var dy=e.changedTouches[0].clientY-tsy;
    tsx=null;tsy=null;
    if(Math.abs(dx)<50&&Math.abs(dy)<50)return;
    var active=slides[current];
    var canScroll=active.scrollHeight>active.clientHeight+4;
    var atTop=active.scrollTop<=2;
    var atBottom=active.scrollTop+active.clientHeight>=active.scrollHeight-2;
    if(dy<0||dx<0){if(!canScroll||atBottom)go(current+1);}
    else{if(!canScroll||atTop)go(current-1);}
  },{passive:true});
  go(0);
})();
</script>
