2737372704_b41dbe9d08f7c389ea896a8e2c40b53a_858a8978fb.webp", "engine": "Premium Unleaded V-12 6.5 L/396", "condition": "Used", "url": "https://mph.com/autos/listing/2023/ferrari/812-gts/541205", "decoded_brand": "Ferrari", "decoded_year": 2023, "check": "valid", "country": "Italy"}, {"vin": "ZFF97CMA7N0275882", "year": 2022, "price": 1000000, "brand": "Ferrari", "model": "812 GTS", "miles": 63, "city": "Fort Lauderdale", "state": "FL", "dealer": "Ferrari of Fort Lauderdale", "address": "5750 N Federal Hwy", "photo": "https://d2l6r91nnee1so.cloudfront.net/media/large_mph000_2644223919_7c50a77d852d809da4a25da71e03635e_90a75933e5.webp", "engine": "Premium Unleaded V-12 6.5 L/396", "condition": "Used", "url": "https://mph.com/autos/listing/2022/ferrari/812-gts/548702", "decoded_brand": "Ferrari", "decoded_year": 2022, "check": "valid", "country": "Italy"}];
const fmt = n => "$" + n.toLocaleString("en-US");

function vinBadge(c) {
  const ok = c.check === "valid";
  const cl = ok ? "ok" : "bad";
  const label = ok ? "✓" : "?";
  return '<div class="vin">VIN ' + c.vin + ' <span class="' + cl + '">' + label + '</span></div>';
}

function imgFallback(el) {
  el.parentElement.innerHTML = '<div class="noimg">🏎️</div>';
}

const PRICE_BUCKETS = [["1000000",1000000,2000000,"$1M – $2M"],["2000000",2000000,5000000,"$2M – $5M"],["5000000",5000000,Infinity,"$5M+"]];
const bucketLo = v => v === "1000000" ? 1000000 : v === "2000000" ? 2000000 : 5000000;
const bucketHi = v => v === "1000000" ? 2000000 : v === "2000000" ? 5000000 : Infinity;

function render() {
  const el = id => document.getElementById(id);
  let f = {
    q: el("q").value.trim().toLowerCase(),
    b: el("brand").value,
    st: el("state").value,
    pr: el("price").value,
    sort: el("sort").value
  };
  // Single source of truth for what a car matches (used by facets AND results).
  const match = (c, x) => {
    if (x.b && c.brand !== x.b) return false;
    if (x.st && c.state !== x.st) return false;
    if (x.pr) {
      const lo = bucketLo(x.pr); const hi = bucketHi(x.pr);
      if (c.price < lo || c.price >= hi) return false;
    }
    if (x.q) {
      const hay = (c.brand + " " + c.model + " " + c.dealer + " " + c.city + " " + c.year).toLowerCase();
      if (!hay.includes(x.q)) return false;
    }
    return true;
  };
  const uniq = arr => [...new Set(arr)].filter(Boolean).sort();

  // Faceted options: each dropdown only lists values that still exist in the
  // cars matching the OTHER active filters (cross-filtering).
  let brandOpts = uniq(CARS.filter(c => match(c, {q: f.q, st: f.st, pr: f.pr})).map(c => c.brand));
  let stateOpts = uniq(CARS.filter(c => match(c, {q: f.q, b: f.b, pr: f.pr})).map(c => c.state));
  let priceOpts = PRICE_BUCKETS.filter(([v]) => CARS.some(c => match(c, {q: f.q, b: f.b, st: f.st, pr: v})));

  // Reset any selection that the other filters now exclude, then recompute.
  let changed = false;
  if (f.b && !brandOpts.includes(f.b)) { f.b = ""; changed = true; }
  if (f.st && !stateOpts.includes(f.st)) { f.st = ""; changed = true; }
  if (f.pr && !priceOpts.some(p => p[0] === f.pr)) { f.pr = ""; changed = true; }
  if (changed) {
    brandOpts = uniq(CARS.filter(c => match(c, {q: f.q, st: f.st, pr: f.pr})).map(c => c.brand));
    stateOpts = uniq(CARS.filter(c => match(c, {q: f.q, b: f.b, pr: f.pr})).map(c => c.state));
    priceOpts = PRICE_BUCKETS.filter(([v]) => CARS.some(c => match(c, {q: f.q, b: f.b, st: f.st, pr: v})));
    el("brand").value = f.b; el("state").value = f.st; el("price").value = f.pr;
  }

  // Rebuild dropdowns preserving the (possibly reset) selection.
  const fill = (id, opts, sel, allLabel) => {
    el(id).innerHTML = '<option value="">' + allLabel + '</option>'
      + opts.map(v => '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + v + '</option>').join("");
  };
  fill("brand", brandOpts, f.b, "All Brands");
  fill("state", stateOpts, f.st, "All States");
  el("price").innerHTML = '<option value="">Any Price</option>'
    + priceOpts.map(p => '<option value="' + p[0] + '"' + (p[0] === f.pr ? ' selected' : '') + '>' + p[3] + '</option>').join("");

  const list = CARS.filter(c => match(c, f)).sort((a, b) => f.sort === "desc" ? b.price - a.price : a.price - b.price);
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = list.map(c => {
    const img = c.photo
      ? '<img src="' + c.photo + '" alt="' + c.year + ' ' + c.brand + ' ' + c.model + '" loading="lazy" onerror="imgFallback(this)">'
      : '<div class="noimg">🏎️</div>';
    const miles = c.miles ? c.miles.toLocaleString("en-US") + " mi" : "—";
    const dec = c.decoded_brand ? '<div class="vin">Decoded: ' + c.decoded_brand + (c.decoded_year ? " · " + c.decoded_year : "") + ' · ' + c.country + '</div>' : '';
    return '<div class="card">'
      + '<div class="card-photo">' + img + '</div>'
      + '<div class="card-body">'
      + '<div class="price">' + fmt(c.price) + '</div>'
      + '<div class="title"><span class="brand">' + c.brand + '</span> ' + c.year + ' ' + c.model + '</div>'
      + '<div class="meta"><span>📍 ' + c.city + ', ' + c.state + '</span><span>🛣️ ' + miles + '</span>' + (c.condition ? '<span>' + c.condition + '</span>' : '') + '</div>'
      + vinBadge(c)
      + dec
      + '<div class="dealer">' + c.dealer + '</div>'
      + '<a class="card-link" href="' + (c.url || "https://mph.com/autos/results/all/all") + '" target="_blank" rel="noopener">View Listing →</a>'
      + '</div></div>';
  }).join("");
  empty.style.display = list.length ? "none" : "block";
}

["q","brand","state","price","sort"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
render();
</script>

<script>
(function(){
  function initMobileMenu(){
    var burger=document.getElementById('navBurger');
    if(!burger||document.getElementById('mobileMenu').dataset.mnInit)return;
    var menu=document.getElementById('mobileMenu');
    var backdrop=document.getElementById('mobileMenuBackdrop');
    var links=document.querySelector('.nav-links');
    if(menu.children.length===0&&links){
      links.querySelectorAll('a:not(.nav-cta)').forEach(function(a){if(a.closest('#navLoginBtn'))return;if((a.getAttribute('href')||'')==='/tutor'&&!a.classList.contains('nav-drawer-only'))return;menu.appendChild(a.cloneNode(true));});
    }
    var p=location.pathname;
    if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);
    menu.querySelectorAll('a').forEach(function(a){
      var h=a.getAttribute('href')||'';
      h=h.split('?')[0].split('#')[0];
      if(h.length>1&&h.endsWith('/'))h=h.slice(0,-1);
      if(h==='/'?p==='/':p.indexOf(h)===0)a.classList.add('active');
    });
    function open(){menu.classList.add('open');backdrop.classList.add('open');burger.classList.add('open');burger.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}
    function close(){menu.classList.remove('open');backdrop.classList.remove('open');burger.classList.remove('open');burger.setAttribute('aria-expanded','false');document.body.style.overflow='';}
    burger.addEventListener('click',function(){menu.classList.contains('open')?close():open();});
    backdrop.addEventListener('click',close);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});
    menu.dataset.mnInit='1';
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initMobileMenu);}else{initMobileMenu();}
})();
</script>
