<meta charset="UTF-8">

<title>Payment Sent — Royce AI Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--bg-card:#111;--text:#f5f5f5;--text-secondary:#a1a1aa;--accent:#667eea;--green:#22c55e;--font:'Inter',system-ui,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;text-align:center}
.icon{font-size:4rem;margin-bottom:20px}
h1{font-size:2rem;font-weight:700;margin-bottom:8px}
h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:var(--text-secondary);font-size:1rem;margin-bottom:32px;max-width:400px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;font-family:var(--font);font-size:0.95rem;font-weight:600;text-decoration:none;background:var(--accent);color:white;transition:all 0.2s}
.btn:hover{transform:translateY(-2px);opacity:0.9}
@media(max-width:1099px){.nav-links a:not(.nav-cta):not(.nav-show-mobile){display:none!important}}
</style>

<body>
<div class="icon">✅</div>
<h1>Payment <span>Sent</span></h1>
<p>Your payment is being processed. You'll receive a confirmation from PayPal shortly. If you have any questions, chat with us on the website.</p>
<a href="/chat" class="btn">💬 Chat with us</a>
<a href="/" style="display:block;margin-top:12px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none">← Back to home</a>
</body>
