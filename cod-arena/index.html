<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD ARENA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    #start-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; cursor: pointer; transition: opacity 0.3s, pointer-events 0.3s;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay h1 { font-size: 4rem; color: #fff; text-shadow: 0 0 20px #ff3333; letter-spacing: 0.3em; margin-bottom: 0.5rem; }
    #start-overlay p { font-size: 1.5rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.2em; }
    #hud { position: fixed; inset: 20px; pointer-events: none; display: none; }
    #hud.visible { display: block; }
    .hud-panel { position: absolute; color: #fff; text-shadow: 0 0 5px #000; font-size: 1.2rem; }
    #health { bottom: 20px; left: 20px; }
    #ammo { bottom: 20px; right: 20px; text-align: right; }
    #score { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 1.5rem; }
    #level { top: 20px; left: 20px; font-size: 1.3rem; }
    #targets { top: 50px; left: 20px; font-size: 1.2rem; color: #ffaa00; }
    #timer { top: 20px; right: 20px; font-size: 1.3rem; color: #ff4444; display: none; }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; display: none; z-index: 5;
    }
    #crosshair.visible { display: block; }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000;
    }
    #crosshair::before { width: 2px; height: 12px; left: 11px; top: 0; }
    #crosshair::after { width: 12px; height: 2px; top: 11px; left: 0; }
    #fps { position: fixed; top: 20px; right: 20px; color: #0f0; font-family: monospace; font-size: 0.9rem; z-index: 5; }
    #level-clear {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 20;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #level-clear.visible { opacity: 1; }
    #level-clear h2 { font-size: 5rem; color: #00ff88; text-shadow: 0 0 30px #00ff88; letter-spacing: 0.2em; }
    #victory-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #victory-overlay.visible { opacity: 1; pointer-events: auto; }
    #victory-overlay h1 { font-size: 5rem; color: #ffaa00; text-shadow: 0 0 30px #ffaa00; letter-spacing: 0.2em; margin-bottom: 1rem; }
    #victory-overlay p { font-size: 2rem; color: #fff; margin-bottom: 2rem; }
    #victory-overlay button {
      padding: 1rem 3rem; font-size: 1.5rem; font-family: inherit;
      background: #ffaa00; color: #000; border: none; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.1em; transition: background 0.2s;
    }
    #victory-overlay button:hover { background: #ffcc00; }
  </style>
</head>
<body>
  <div id="start-overlay" onclick="startGame()">
    <h1 id="start-title">LEVEL 1</h1>
    <p id="start-desc">Destroy 5 targets</p>
  </div>
  <div id="hud">
    <div id="health" class="hud-panel">HEALTH: <span id="health-val">100</span></div>
    <div id="ammo" class="hud-panel">AMMO: <span id="ammo-val">30</span> / <span id="ammo-reserve">90</span></div>
    <div id="score" class="hud-panel">SCORE: <span id="score-val">0</span></div>
    <div id="level" class="hud-panel">LEVEL: 1</div>
    <div id="targets" class="hud-panel">TARGETS: 0/0</div>
    <div id="timer" class="hud-panel">TIME: 0s</div>
  </div>
  <div id="crosshair"></div>
  <div id="fps">FPS: 0</div>
  <div id="level-clear">
    <h2>LEVEL CLEAR</h2>
  </div>
  <div id="victory-overlay">
    <h1>VICTORY</h1>
    <p>Total Score: <span id="victory-score">0</span></p>
    <button id="play-again">Play Again</button>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
