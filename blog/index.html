<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #111;
  --bg-elevated: #1a1a1a;
  --text: #f5f5f5;
  --text-secondary: #a1a1aa;
  --border: rgba(255,255,255,0.06);
  --accent: #667eea;
  --accent-hover: #7c93f5;
  --accent-glow: rgba(102,126,234,0.2);
  --accent-bg: rgba(102,126,234,0.08);
  --purple-deep: #764ba2;
  --radius: 16px;
  --radius-sm: 10px;
  --max-w: 1200px;
  --nav-h: 64px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
  pointer-events: none;
  z-index: 9999;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  max-width: var(--max-w);
  margin: 0 auto;
  z-index: 100;
  background: rgba(10,10,10,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-logo .logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--purple-deep));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: white;
}
.nav-logo span { color: var(--accent); }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 8px;
  transition: all 0.2s;
}
.nav-links a:hover { color: var(--text); background: var(--accent-bg); }
.nav-links a.active { color: var(--accent); background: var(--accent-bg); }
.nav-links .nav-cta {
  background: var(--accent);
  color: white !important;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: 8px;
}
.nav-links .nav-cta:hover { background: var(--accent-hover); transform: scale(1.05); }

.hero-sub {
  padding: 120px 24px 60px;
  max-width: var(--max-w);
  margin: 0 auto;
  text-align: center;
}
.hero-sub h1 {
  font-size: clamp(2.5rem, 6vw, 3.5rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
  margin-bottom: 16px;
}
.hero-sub h1 .gradient {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #667eea 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease-in-out infinite;
}
.hero-sub p { color: var(--text-secondary); font-size: 1.1rem; }

.blog-categories {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px 80px;
  justify-content: center;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 32px;
  align-items: start;
}
.blog-category {}
.blog-category h3 {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.blog-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: all var(--transition);
  text-decoration: none;
  color: inherit;
  display: block;
  margin-bottom: 12px;
  max-width: 100%;
}
.blog-card:hover {
  border-color: rgba(102,126,234,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.blog-card .tag { color: var(--accent); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; display: block; }
.blog-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; border: none; padding: 0; letter-spacing: normal; text-transform: none; color: var(--text); }
.blog-card p { color: var(--text-secondary); font-size: 0.8rem; line-height: 1.5; }
.blog-card .date { color: var(--text-secondary); font-size: 0.75rem; margin-top: 8px; display: block; }

.blog-card {

}

.blog-card .date { color: var(--text-secondary); font-size: 0.8rem; margin-top: 12px; display: block; }
