<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Royce AI Solutions</title>
<meta name="description" content="Chat with RoyceAI directly on the web. AI receptionist, tutor, and business assistant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-card: #111;
  --bg-elevated: #1a1a1a;
  --text: #f5f5f5;
  --text-secondary: #a1a1aa;
  --border: rgba(255,255,255,0.06);
  --accent: #667eea;
  --accent-hover: #7c93f5;
  --accent-glow: rgba(102,126,234,0.15);
  --accent-bg: rgba(102,126,234,0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  height:100%;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* Nav */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;height:56px;border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-logo{
  font-size:17px;font-weight:700;letter-spacing:-0.3px;
  display:flex;align-items:center;gap:8px;
}
.nav-logo span{color:var(--accent);}
.nav-back{
  font-size:13px;color:var(--text-secondary);text-decoration:none;
  display:flex;align-items:center;gap:6px;transition:color var(--transition);
}
.nav-back:hover{color:var(--accent);}

/* Chat container */
.chat-wrap{
  flex:1;display:flex;flex-direction:column;max-width:720px;
  width:100%;margin:0 auto;padding:0 16px 16px;overflow:hidden;
}

.messages{
  flex:1;overflow-y:auto;padding:20px 4px 12px;
  display:flex;flex-direction:column;gap:8px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-track{background:transparent;}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.msg{
  max-width:88%;padding:10px 16px;border-radius:var(--radius-sm);
  line-height:1.6;font-size:14px;animation:msgIn 0.25s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}

.msg.user{
  align-self:flex-end;background:var(--accent);color:#fff;
  border-bottom-right-radius:4px;
}
.msg.bot{
  align-self:flex-start;background:var(--bg-card);color:var(--text);
  border-bottom-left-radius:4px;border:1px solid var(--border);
}
.msg.system{
  align-self:center;background:transparent;color:var(--text-secondary);
  font-size:12px;text-align:center;padding:6px 12px;
}
.msg.bot a,.msg.bot strong{color:var(--accent);}
.msg.bot a{text-decoration:underline;}

/* Typing */
.typing{
  align-self:flex-start;background:var(--bg-card);padding:12px 18px;
  border-radius:var(--radius-sm);border-bottom-left-radius:4px;
  border:1px solid var(--border);display:flex;gap:5px;align-items:center;
}
.typing-dot{
  width:7px;height:7px;background:var(--text-secondary);border-radius:50%;
  animation:typingBounce 1.4s infinite ease-in-out;
}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);}
  30%{transform:translateY(-6px);}
}

/* Input */
.input-area{
  display:flex;gap:8px;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:8px;
  transition:border-color var(--transition);
}
.input-area:focus-within{border-color:var(--accent);}
.input-area input{
  flex:1;border:none;outline:none;font-size:14px;font-family:var(--font);
  background:transparent;color:var(--text);
}
.input-area input::placeholder{color:var(--text-secondary);}
.input-area button{
  background:var(--accent);color:#fff;border:none;
  width:38px;height:38px;border-radius:var(--radius-sm);
  font-size:16px;cursor:pointer;transition:all var(--transition);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.input-area button:hover{background:var(--accent-hover);transform:scale(1.05);}
.input-area button:disabled{background:var(--border);cursor:not-allowed;transform:none;}

/* Quick buttons */
.quick-btns{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  padding:10px 0 4px;
}
.quick-btns button{
  background:var(--bg-card);border:1px solid var(--border);border-radius:20px;
  padding:7px 14px;font-size:12px;cursor:pointer;font-family:var(--font);
  transition:all var(--transition);color:var(--text-secondary);
}
.quick-btns button:hover{
  background:var(--accent-bg);color:var(--accent);border-color:var(--accent);
}

@media(max-width:480px){
  .nav{padding:10px 16px;}
  .msg{max-width:92%;font-size:13px;}
  .quick-btns button{font-size:11px;padding:6px 12px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">Royce<span>AI</span></div>
  <a href="https://royceaisolutions.github.io" class="nav-back">← Back to site</a>
</div>

<div class="chat-wrap">
  <div class="messages" id="messages">
    <div class="msg bot" id="welcomeMsg">
      👋 Hey! I'm RoyceAI. Ask me about:
      <br><br>
      • <b>AI Receptionists</b> — 24/7 call answering<br>
      • <b>Tutoring</b> — Math, Science, English, Korean<br>
      • <b>Websites</b> — Custom, AI-integrated<br>
      • <b>Business AI</b> — Automations, chatbots<br><br>
      What can I help you with?
    </div>
  </div>

  <div class="quick-btns" id="quickBtns">
    <button onclick="sendQuick('Tell me about your AI receptionist')">📞 AI Receptionist</button>
    <button onclick="sendQuick('I need a tutor')">🧠 Tutoring</button>
    <button onclick="sendQuick('I need a website')">🌐 Website</button>
    <button onclick="sendQuick('Pricing?')">💰 Pricing</button>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask me anything..." autofocus onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL = 'https://chat-api-tawny-zeta.vercel.app/api/chat';
let history = [];
let msgCount = 0;

function addMessage(content, sender) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerHTML = content;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(show) {
  const existing = document.querySelector('.typing');
  if (existing) existing.remove();
  if (!show) return;
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function formatReply(text) {
  let html = text
    .replace(/### (.*)/g, '<strong>$1</strong><br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  return html;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMessage(text, 'user');
  showTyping(true);
  history.push({ role: 'user', content: text });
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-20) }),
    });
    const data = await resp.json();
    let reply = data.reply || 'Sorry, I had trouble with that.';
    history.push({ role: 'assistant', content: reply });
    showTyping(false);
    addMessage(formatReply(reply), 'bot');
  } catch (e) {
    showTyping(false);
    addMessage('⚠️ Connection error. Try again later.', 'bot');
  }
  document.getElementById('sendBtn').disabled = false;
  msgCount++;
  if (msgCount === 3) {
    addMessage('💡 Want to continue later? Bookmark this page and come back.', 'system');
  }
}
</script>
</body>
</html>
