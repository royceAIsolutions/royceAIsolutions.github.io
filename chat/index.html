<script>
const C='https://chat-api-tawny-zeta.vercel.app/api/chat',Q='https://chat-api-tawny-zeta.vercel.app/api/quiz',S='https://chat-api-tawny-zeta.vercel.app/api/save-score';
let history=[],msgCount=0,leadInfo=null,quizMode=false,quizCorrect=0,quizTotal=0;
function gp(){try{return JSON.parse(localStorage.getItem('royceai_lead'))}catch(e){return null}}
function sp(i){localStorage.setItem('royceai_lead',JSON.stringify(i))}
function lh(){try{var d=JSON.parse(localStorage.getItem('royceai_chat_history'));if(d&&Array.isArray(d))return d}catch(e){}return[]}
function sh(){localStorage.setItem('royceai_chat_history',JSON.stringify(history.slice(-100)))}
function rh(){var s=lh();if(!s.length)return false;history=s;var m=document.getElementById('messages');m.innerHTML='';for(var i=0;i<history.length;i++){var msg=history[i];if(msg.role==='user'||msg.role==='assistant'){var d=document.createElement('div');d.className='msg '+(msg.role==='user'?'user':'bot');d.innerHTML=msg.role==='assistant'?fr(msg.content):msg.content;m.appendChild(d)}}return true}
function gs(){var p=new URLSearchParams(window.location.search);return p.get('subject')}
function init(){var subject=gs();quizMode=!!subject;var tu=function(){try{return JSON.parse(localStorage.getItem('tutor_user'))}catch(e){return null}}();var sl=gp()
if(!sl){if(tu){leadInfo={name:tu.name,email:tu.name.toLowerCase().replace(/\s+/g,'.')+'@student.tutor',phone:'000-000-0000',timestamp:new Date().toISOString()};sp(leadInfo)}else if(subject){leadInfo={name:subject.charAt(0).toUpperCase()+subject.slice(1)+' Student',email:subject+'@tutor.royceai.com',phone:'000-000-0000',timestamp:new Date().toISOString()};sp(leadInfo)}else{return}}else{leadInfo=sl}
showChat();var h=rh();if(h){var msg=document.getElementById('messages');var s=document.createElement('div');s.className='msg system';s.textContent='↻ Welcome back, '+(leadInfo.name||'');msg.appendChild(s)}
if(subject){setTimeout(function(){var inp=document.getElementById('userInput');inp.value='Start '+subject+' quiz for '+(leadInfo.name||'me');sendMessage()},800)}}
function ve(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function vp(p){var c=p.replace(/[\s\-\(\)\.]/g,'');return/^(\+?1?\d{10})$/.test(c)||/^\d{10}$/.test(c)}
function submitLead(){var n=document.getElementById('leadName').value.trim(),e=document.getElementById('leadEmail').value.trim(),p=document.getElementById('leadPhone').value.trim(),v=true
if(!n){document.getElementById('nameGroup').classList.add('invalid');v=false}else{document.getElementById('nameGroup').classList.remove('invalid')}
if(!e||!ve(e)){document.getElementById('emailGroup').classList.add('invalid');v=false}else{document.getElementById('emailGroup').classList.remove('invalid')}
if(!p||!vp(p)){document.getElementById('phoneGroup').classList.add('invalid');v=false}else{document.getElementById('phoneGroup').classList.remove('invalid')}
if(!v)return;var btn=document.getElementById('submitLead');btn.disabled=true;btn.textContent='Submitting...'
leadInfo={name:n,email:e,phone:p,timestamp:new Date().toISOString()};sp(leadInfo)
fetch(C.replace('/api/chat','/api/lead'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(leadInfo)}).catch(function(){});
document.getElementById('leadSent').classList.add('active');setTimeout(showChat,800)}
function showChat(){document.getElementById('leadOverlay').style.display='none';document.getElementById('chatApp').classList.add('active');document.getElementById('userInput').focus()
if(quizMode)document.getElementById('welcomeMsg').innerHTML='🎯 <b>Quiz Mode</b> — I\'ll ask questions one at a time!'}
function am(c,s){var m=document.getElementById('messages'),d=document.createElement('div');d.className='msg '+s;d.innerHTML=c;m.appendChild(d);m.scrollTop=m.scrollHeight}
function st(s){var e=document.querySelector('.typing');if(e)e.remove();if(!s)return;var d=document.createElement('div');d.className='typing';d.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';document.getElementById('messages').appendChild(d);document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
function sq(t){document.getElementById('userInput').value=t;sendMessage()}
function fr(t){return t.replace(/### (.*)/g,'<strong>$1</strong><br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function checkSave(reply){
  if(!quizMode||!reply)return;
  var m=reply.match(/Score:\s*(\d+)\s*\/\s*(\d+)/i);
  if(!m){m=reply.match(/(\d+)\s*\/\s*(\d+)/g);if(m)m=m[m.length-1].split('/');else return}
  if(!Array.isArray(m))m=m.split('/');
  var c=parseInt(m[1]||m[0]),t=parseInt(m[2]||m[1]);
  if(!t||t<1||c>t)return;
  quizCorrect=c;quizTotal=t;
  if(t>=10&&reply.match(/Q10\/10|completed|Complete|done|final/i)){
    var subj=gs()||'quiz';
    fetch(S,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:leadInfo?leadInfo.name:'Student',correct:c,total:t,subject:subj})}).catch(function(){});
    setTimeout(function(){am('✅ Saved: '+c+'/'+t+' ('+Math.round(c/t*100)+'%)','system')},600);
  }
}
async function sendMessage(){var inp=document.getElementById('userInput'),t=inp.value.trim();if(!t)return;inp.value='';document.getElementById('sendBtn').disabled=true
am(t,'user');st(true);history.push({role:'user',content:t});sh()
try{var url=quizMode?Q:C;var body={message:t};if(quizMode){body.history=history.slice(-20)}else{body.lead=leadInfo;body.history=history.slice(-40)}
var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json()
st(false);var reply=d.reply||(quizMode?'Type "next" for another question':'Thanks for your message!');history.push({role:'assistant',content:reply});am(fr(reply),'bot');sh()
if(quizMode)checkSave(reply)}
catch(e){st(false);am('⚠️ Connection error.','bot')}
document.getElementById('sendBtn').disabled=false;msgCount++
if(msgCount===3&&!quizMode)am('💡 Bookmark this page to come back.','system')}
init();
</script>
