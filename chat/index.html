<script>
const API_URL = 'https://chat-api-tawny-zeta.vercel.app/api/chat';
let history = [];
let msgCount = 0;
let leadInfo = null;

function getProfile() {
  try { return JSON.parse(localStorage.getItem('royceai_lead')); } catch(e) { return null; }
}

function saveProfile(info) {
  localStorage.setItem('royceai_lead', JSON.stringify(info));
}

function loadHistory() {
  try {
    const data = JSON.parse(localStorage.getItem('royceai_chat_history'));
    if (data && Array.isArray(data)) return data;
  } catch(e) {}
  return [];
}

function saveHistory() {
  const trimmed = history.slice(-100);
  localStorage.setItem('royceai_chat_history', JSON.stringify(trimmed));
}

function replayHistory() {
  const saved = loadHistory();
  if (saved.length === 0) return false;
  history = saved;
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  for (const msg of history) {
    if (msg.role === 'user' || msg.role === 'assistant') {
      const div = document.createElement('div');
      div.className = 'msg ' + (msg.role === 'user' ? 'user' : 'bot');
      div.innerHTML = msg.role === 'assistant' ? formatReply(msg.content) : msg.content;
      msgs.appendChild(div);
    }
  }
  return true;
}

function getSubjectFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('subject');
}

function init() {
  const subject = getSubjectFromUrl();
  const tutorUser = (() => { try { return JSON.parse(localStorage.getItem('tutor_user')); } catch(e) { return null; } })();
  const savedLead = getProfile();

  // Direct subject link with no profile — create from tutor_user or use generic
  if (!savedLead) {
    if (tutorUser) {
      leadInfo = {
        name: tutorUser.name,
        email: tutorUser.name.toLowerCase().replace(/\s+/g, '.') + '@student.tutor',
        phone: '000-000-0000',
        timestamp: new Date().toISOString()
      };
      saveProfile(leadInfo);
    } else if (subject) {
      // Coming from direct link with subject but no login — still create minimal lead
      leadInfo = {
        name: subject.charAt(0).toUpperCase() + subject.slice(1) + ' Student',
        email: subject + '@tutor.royceai.com',
        phone: '000-000-0000',
        timestamp: new Date().toISOString()
      };
      saveProfile(leadInfo);
    } else {
      return; // Stay on lead form
    }
  } else {
    leadInfo = savedLead;
  }

  showChat();

  const hadHistory = replayHistory();
  if (hadHistory) {
    const msgs = document.getElementById('messages');
    const sep = document.createElement('div');
    sep.className = 'msg system';
    sep.textContent = '↻ Welcome back, ' + (leadInfo.name || '') + ' — continuing where you left off';
    msgs.appendChild(sep);
  }

  // Auto-send subject from URL
  if (subject) {
    setTimeout(() => {
      document.getElementById('userInput').value = 'Start ' + subject + ' quiz for ' + (leadInfo.name || 'me');
      sendMessage();
    }, 600);
  }
}

function validateEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validatePhone(p) {
  const cleaned = p.replace(/[\s\-\(\)\.]/g, '');
  return /^(\+?1?\d{10})$/.test(cleaned) || /^\d{10}$/.test(cleaned);
}

function submitLead() {
  const name = document.getElementById('leadName').value.trim();
  const email = document.getElementById('leadEmail').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  let valid = true;

  if (!name) { document.getElementById('nameGroup').classList.add('invalid'); valid = false; }
  else { document.getElementById('nameGroup').classList.remove('invalid'); }

  if (!email || !validateEmail(email)) { document.getElementById('emailGroup').classList.add('invalid'); valid = false; }
  else { document.getElementById('emailGroup').classList.remove('invalid'); }

  if (!phone || !validatePhone(phone)) { document.getElementById('phoneGroup').classList.add('invalid'); valid = false; }
  else { document.getElementById('phoneGroup').classList.remove('invalid'); }

  if (!valid) return;

  const btn = document.getElementById('submitLead');
  btn.disabled = true; btn.textContent = 'Submitting...';
  leadInfo = { name, email, phone, timestamp: new Date().toISOString() };
  saveProfile(leadInfo);

  fetch(API_URL.replace('/api/chat', '/api/lead'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(leadInfo),
  }).catch(() => {});

  document.getElementById('leadSent').classList.add('active');
  setTimeout(showChat, 800);
}

function showChat() {
  document.getElementById('leadOverlay').style.display = 'none';
  document.getElementById('chatApp').classList.add('active');
  document.getElementById('userInput').focus();

  const subject = getSubjectFromUrl();
  if (subject && !document.querySelector('.msg.user')) {
    // No messages yet and subject in URL — auto-send if not already triggered
    setTimeout(() => {
      const input = document.getElementById('userInput');
      if (input && !input.value) {
        input.value = 'Start ' + subject + ' quiz for ' + (leadInfo?.name || 'me');
        sendMessage();
      }
    }, 800);
  }
}

function addMessage(content, sender) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerHTML = content;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(show) {
  const existing = document.querySelector('.typing');
  if (existing) existing.remove();
  if (!show) return;
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function sendQuick(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function formatReply(text) {
  return text.replace(/### (.*)/g, '<strong>$1</strong><br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMessage(text, 'user');
  showTyping(true);
  history.push({ role: 'user', content: text });
  saveHistory();
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, lead: leadInfo, history: history.slice(-40) }),
    });
    const data = await resp.json();
    if (data.sent && data.requestId) {
      let reply = null;
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try {
          const pollResp = await fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checkId: data.requestId }),
          });
          const pollData = await pollResp.json();
          if (pollData.found && pollData.reply) { reply = pollData.reply; break; }
        } catch(e) {}
      }
      showTyping(false);
      if (reply) {
        history.push({ role: 'assistant', content: reply });
        addMessage(formatReply(reply), 'bot');
        saveHistory();
      } else {
        addMessage("Thanks! I'll get back to you shortly.", 'bot');
      }
    } else {
      showTyping(false);
      let reply = data.reply || 'Thanks for your message!';
      history.push({ role: 'assistant', content: reply });
      addMessage(formatReply(reply), 'bot');
      saveHistory();
    }
  } catch (e) {
    showTyping(false);
    addMessage('⚠️ Connection error. Try again later.', 'bot');
  }
  document.getElementById('sendBtn').disabled = false;
  msgCount++;
  if (msgCount === 3) {
    addMessage('💡 Want to continue later? Bookmark this page and come back.', 'system');
  }
}

init();
</script>
