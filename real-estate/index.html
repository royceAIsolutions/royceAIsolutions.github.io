const PRICE_BUCKETS = [["10m",10000000,25000000,"$10M – $25M"],["25m",25000000,50000000,"$25M – $50M"],["50m",50000000,Infinity,"$50M+"]];
const bucketLo = v => v === "10m" ? 10000000 : v === "25m" ? 25000000 : 50000000;
const bucketHi = v => v === "10m" ? 25000000 : v === "25m" ? 50000000 : Infinity;

function render() {
  const el = id => document.getElementById(id);
  let f = {
    q: el("q").value.trim().toLowerCase(),
    st: el("state").value,
    bd: el("beds").value,
    pr: el("price").value,
    sort: el("sort").value
  };
  const match = (h, x) => {
    if (x.st && h.state !== x.st) return false;
    if (x.bd && Number(h.beds) !== Number(x.bd)) return false;
    if (x.pr) {
      const lo = bucketLo(x.pr); const hi = bucketHi(x.pr);
      if (h.price < lo || h.price >= hi) return false;
    }
    if (x.q) {
      const hay = (h.address + " " + h.city + " " + h.state).toLowerCase();
      if (!hay.includes(x.q)) return false;
    }
    return true;
  };
  const uniq = arr => [...new Set(arr)].filter(Boolean).sort();

  // Faceted options: each dropdown lists values present among homes matching
  // the OTHER active filters (cross-filtering).
  let stateOpts = uniq(HOMES.filter(h => match(h, {q: f.q, bd: f.bd, pr: f.pr})).map(h => h.state));
  let bedOpts = uniq(HOMES.filter(h => match(h, {q: f.q, st: f.st, pr: f.pr})).map(h => h.beds)).map(Number).sort((a,b)=>a-b).map(String);
  let priceOpts = PRICE_BUCKETS.filter(([v]) => HOMES.some(h => match(h, {q: f.q, st: f.st, bd: f.bd, pr: v})));

  let changed = false;
  if (f.st && !stateOpts.includes(f.st)) { f.st = ""; changed = true; }
  if (f.bd && !bedOpts.includes(f.bd)) { f.bd = ""; changed = true; }
  if (f.pr && !priceOpts.some(p => p[0] === f.pr)) { f.pr = ""; changed = true; }
  if (changed) {
    stateOpts = uniq(HOMES.filter(h => match(h, {q: f.q, bd: f.bd, pr: f.pr})).map(h => h.state));
    bedOpts = uniq(HOMES.filter(h => match(h, {q: f.q, st: f.st, pr: f.pr})).map(h => h.beds)).map(Number).sort((a,b)=>a-b).map(String);
    priceOpts = PRICE_BUCKETS.filter(([v]) => HOMES.some(h => match(h, {q: f.q, st: f.st, bd: f.bd, pr: v})));
    el("state").value = f.st; el("beds").value = f.bd; el("price").value = f.pr;
  }

  const fill = (id, opts, sel, allLabel) => {
    el(id).innerHTML = '<option value="">' + allLabel + '</option>'
      + opts.map(v => '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + v + '</option>').join("");
  };
  fill("state", stateOpts, f.st, "All States");
  fill("beds", bedOpts, f.bd, "Any Beds");
  el("price").innerHTML = '<option value="">Any Price</option>'
    + priceOpts.map(p => '<option value="' + p[0] + '"' + (p[0] === f.pr ? ' selected' : '') + '>' + p[3] + '</option>').join("");

  const list = HOMES.filter(h => match(h, f)).sort((a, b) => f.sort === "desc" ? b.price - a.price : a.price - b.price);
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = list.map(h => {
    const img = h.photo
      ? '<img src="' + h.photo + '" alt="' + h.address + '" loading="lazy" onerror="imgFallback(this)">'
      : '<div class="noimg">🏠</div>';
    const beds = h.beds ? h.beds + ' bd' : '';
    const baths = h.baths ? h.baths + ' ba' : '';
    const sqft = h.sqft ? Number(h.sqft).toLocaleString("en-US") + ' sqft' : '';
    const stats = [beds, baths, sqft].filter(Boolean).join(' · ');
    return '<div class="card">'
      + '<div class="card-photo">' + img + '</div>'
      + '<div class="card-body">'
      + '<div class="price">' + fmt(h.price) + '</div>'
      + '<div class="title">' + h.city + ', ' + h.state + '</div>'
      + (stats ? '<div class="meta"><span>🏠 ' + stats + '</span></div>' : '')
      + '<div class="addr">📍 ' + h.address + '</div>'
      + (h.status ? '<div class="dealer">' + h.status + '</div>' : '')
      + '<a class="card-link" href="' + h.url + '" target="_blank" rel="noopener">View Listing →</a>'
      + '</div></div>';
  }).join("");
  empty.style.display = list.length ? "none" : "block";
}

["q","state","beds","price","sort"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
render();
</script>
</body>
</html>
