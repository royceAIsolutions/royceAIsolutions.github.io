<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1YMuoRMJiDJP9_viB6dM5-4r2OGvUeZlZEwdVTQymWvM/export?format=csv';
const HISTORY_API = 'https://chat-api-tawny-zeta.vercel.app/api/quiz-history';
let AUTHORIZED_USERS = [];

function extractPercent(s){if(!s)return 0;var m=s.match(/(\d+)%/);return m?parseInt(m[1]):0}

async function loadUsers(){
  try{
    var r=await fetch(SHEET_CSV_URL+'&'+Date.now()),csv=await r.text(),rows=csv.trim().split('\n').slice(1);
    AUTHORIZED_USERS=rows.map(function(row){
      var cols=row.split(','),fn=(cols[0]||'').trim(),ln=(cols[1]||'').trim();
      return{id:(fn+' '+ln).toLowerCase(),firstName:fn,lastName:ln,name:fn+(ln?' '+ln:''),
        subjects:(cols[2]||'').trim(),active:(cols[3]||'').trim().toUpperCase()==='YES',
        today:(cols[4]||'').trim(),mtd:(cols[5]||'').trim(),ytd:(cols[6]||'').trim(),
        topics:(cols[7]||'').trim(),difficulty:(cols[8]||'').trim(),focus:(cols[9]||'').trim(),plan:(cols[10]||'').trim(),
        cards:(cols[11]||'math').trim()};
    }).filter(function(u){return u.id.trim()&&u.active});
    document.getElementById('loginSubtitle').textContent='Enter your name to access tutoring.';
    var saved=localStorage.getItem('tutor_user');
    if(saved){try{var user=JSON.parse(saved);var match=AUTHORIZED_USERS.find(function(u){return u.id===user.id});if(match)showDashboard(match);else localStorage.removeItem('tutor_user')}catch(e){localStorage.removeItem('tutor_user')}}
  }catch(e){document.getElementById('loginSubtitle').textContent='Could not load user list. Try again later.'}
}

function login(){
  var fi=document.getElementById('studentFirstName'),li=document.getElementById('studentLastName'),err=document.getElementById('loginError');
  var fn=fi.value.trim(),ln=li.value.trim(),fullId=(fn+' '+ln).toLowerCase();
  if(!fn){err.textContent='Please enter your first name.';err.classList.add('show');return}
  var user=AUTHORIZED_USERS.find(function(u){return u.id===fullId});
  if(!user){err.textContent='Name not found. Try again or chat with us to get set up.';err.classList.add('show');return}
  err.classList.remove('show');localStorage.setItem('tutor_user',JSON.stringify(user));showDashboard(user)
}

function showDashboard(user){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('show');
  document.getElementById('studentName').textContent=user.name;
  document.getElementById('studentInfo').textContent=user.subjects+' — '+user.plan;

  // Cards from sheet — the sheet is the brain
  var keys=user.cards?user.cards.split(','):['math'];
  document.querySelectorAll('.dash-card').forEach(function(c){
    c.style.display=keys.indexOf(c.dataset.subject)>=0?'block':'none'
  });

  if(user.focus)document.getElementById('focusDisplay').textContent=user.focus;
  if(user.today&&user.today!=='—'){document.getElementById('scoreToday').textContent=user.today;var p=extractPercent(user.today);document.getElementById('barToday').style.width=Math.min(p,100)+'%';document.getElementById('scoreTodaySub').textContent=user.today}
  if(user.mtd&&user.mtd!=='—'){document.getElementById('scoreMTD').textContent=user.mtd;document.getElementById('barMTD').style.width=Math.min(extractPercent(user.mtd),100)+'%';document.getElementById('scoreMTDSub').textContent=user.mtd}
  if(user.ytd&&user.ytd!=='—'){document.getElementById('scoreYTD').textContent=user.ytd;document.getElementById('barYTD').style.width=Math.min(extractPercent(user.ytd),100)+'%';document.getElementById('scoreYTDSub').textContent=user.ytd}
  if(user.topics){document.getElementById('topicsList').innerHTML=user.topics.split(',').map(function(t){return '<span class="tag">'+t.trim()+'</span>'}).join(' ')}

  var badge=document.getElementById('difficultyBadge');
  if(user.difficulty&&user.difficulty!=='—'){
    badge.textContent=user.difficulty;badge.style.display='flex';badge.className='diff-badge';
    var d=user.difficulty;
    if(d.includes('Math 2')||d.includes('Math 3')||d.includes('SAT — Advanced')||d.includes('AP')||d.includes('RN')||d.includes('Series'))badge.classList.add('diff-grade10-12');
    else if(d.includes('Math 1')||d.includes('SAT — On Track'))badge.classList.add('diff-grade7-9');
    else if(d.includes('Game')||d.includes('Baby'))badge.classList.add('diff-grade1-3');
    else badge.classList.add('diff-grade4-6');
  }else{badge.style.display='none'}

  var pct=extractPercent(user.ytd);
  document.getElementById('streakDisplay').innerHTML='🔥 '+(pct>=90?Math.floor(pct/2):0);

  if(user.firstName==='Jiho'||user.firstName==='Carter'||user.firstName==='Josh')loadQuizHistory(user.firstName);

  localStorage.setItem('royceai_lead',JSON.stringify({name:user.name,email:user.name.toLowerCase().replace(/\s+/g,'.')+'@student.tutor',phone:'000-000-0000',timestamp:new Date().toISOString()}))
}

async function loadQuizHistory(name){
  var el=document.getElementById('quizHistory'),tbody=document.getElementById('quizHistoryBody');
  el.style.display='block';tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">Loading...</td></tr>';
  try{
    var r=await fetch(HISTORY_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:name})});
    var d=await r.json(),sessions=d.sessions||[];
    if(!sessions.length){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">No sessions recorded yet</td></tr>';return}
    tbody.innerHTML=sessions.slice(-10).reverse().map(function(s){
      var p=s.percent||Math.round(s.correct/s.total*100),passed=p>=80;
      var topics=s.topics?Object.keys(s.topics).slice(0,2).map(function(t){return '<span class="quiz-topic">'+t.replace(/_/g,' ')+'</span>'}).join(' '):'<span class="quiz-topic">general</span>';
      return '<tr><td>'+(s.date||'—')+'</td><td>'+(s.mode||'quiz')+'</td><td><strong>'+s.correct+'/'+s.total+'</strong> ('+p+'%)</td><td>'+topics+'</td><td class="'+(passed?'quiz-pass':'quiz-fail')+'">'+(passed?'✅ Pass':'❌ Review')+'</td></tr>'
    }).join('')
  }catch(e){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--red-diff)">Could not load history</td></tr>'}
}

function logout(){
  localStorage.removeItem('tutor_user');
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('studentFirstName').value='';document.getElementById('studentLastName').value=''
}

window.addEventListener('DOMContentLoaded',loadUsers);
</script>
