<script>
// ===== GOOGLE SHEET URL =====
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1YMuoRMJiDJP9_viB6dM5-4r2OGvUeZlZEwdVTQymWvM/export?format=csv';

let AUTHORIZED_USERS = [];

async function loadUsers() {
  try {
    const resp = await fetch(SHEET_CSV_URL + '&' + Date.now());
    const csv = await resp.text();
    const rows = csv.trim().split('\n').slice(1);
    AUTHORIZED_USERS = rows.map(row => {
      const cols = row.split(',');
      const firstName = (cols[0] || '').trim();
      const lastName = (cols[1] || '').trim();
      return {
        id: (firstName + ' ' + lastName).toLowerCase(),
        firstName, lastName,
        name: firstName + (lastName ? ' ' + lastName : ''),
        subjects: (cols[2] || '').trim(),
        active: (cols[3] || '').trim().toUpperCase() === 'YES',
        progress: (cols[4] || '').trim(),
        focus: (cols[5] || '').trim(),
        plan: (cols[6] || '').trim(),
      };
    }).filter(u => u.id.trim() && u.active);
    document.getElementById('loginSubtitle').textContent = 'Enter your name to access tutoring.';
    const saved = localStorage.getItem('tutor_user');
    if (saved) {
      try {
        const user = JSON.parse(saved);
        const match = AUTHORIZED_USERS.find(u => u.id === user.id);
        if (match) showDashboard(match);
        else localStorage.removeItem('tutor_user');
      } catch { localStorage.removeItem('tutor_user'); }
    }
  } catch (e) {
    document.getElementById('loginSubtitle').textContent = 'Could not load user list. Try again later.';
  }
}

function login() {
  const firstInput = document.getElementById('studentFirstName');
  const lastInput = document.getElementById('studentLastName');
  const error = document.getElementById('loginError');
  const firstName = firstInput.value.trim();
  const lastName = lastInput.value.trim();
  const fullId = (firstName + ' ' + lastName).toLowerCase();
  if (!firstName) {
    error.textContent = 'Please enter your first name.';
    error.classList.add('show');
    return;
  }
  const user = AUTHORIZED_USERS.find(u => u.id === fullId);
  if (!user) {
    error.textContent = 'Name not found. Try again or chat with us to get set up.';
    error.classList.add('show');
    return;
  }
  error.classList.remove('show');
  localStorage.setItem('tutor_user', JSON.stringify(user));
  showDashboard(user);
}

function showDashboard(user) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('show');
  document.getElementById('studentName').textContent = user.name;
  document.getElementById('studentInfo').textContent = user.subjects + ' — what would you like to study?';
  
  // Fill dynamic stat cards
  if (user.progress && user.progress !== 'N/A') {
    document.getElementById('stat-progress').textContent = user.progress;
    document.getElementById('stat-progress').parentElement.style.display = 'block';
  }
  if (user.focus && user.focus !== 'N/A') {
    document.getElementById('stat-focus').textContent = user.focus;
    document.getElementById('stat-focus').parentElement.style.display = 'block';
  }
  if (user.plan && user.plan !== 'N/A') {
    document.getElementById('stat-plan').textContent = user.plan;
    document.getElementById('stat-plan').parentElement.style.display = 'block';
  }
  
  // Also save as lead so /chat recognizes the student
  localStorage.setItem('royceai_lead', JSON.stringify({
    name: user.name,
    email: user.name.toLowerCase().replace(' ', '.') + '@student.tutor',
    phone: '000-000-0000',
    timestamp: new Date().toISOString()
  }));
}

function logout() {
  localStorage.removeItem('tutor_user');
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('studentFirstName').value = '';
  document.getElementById('studentLastName').value = '';
}

window.addEventListener('DOMContentLoaded', loadUsers);
</script>
