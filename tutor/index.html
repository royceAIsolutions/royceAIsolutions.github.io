<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1YMuoRMJiDJP9_viB6dM5-4r2OGvUeZlZEwdVTQymWvM/export?format=csv';
const HISTORY_API = 'https://chat-api-tawny-zeta.vercel.app/api/quiz-history';
let AUTHORIZED_USERS = [];

function extractPercent(str) {
  if (!str) return 0;
  const m = str.match(/(\d+)%/);
  return m ? parseInt(m[1]) : 0;
}

async function loadUsers() {
  try {
    const resp = await fetch(SHEET_CSV_URL + '&' + Date.now());
    const csv = await resp.text();
    const rows = csv.trim().split('\n').slice(1);
    AUTHORIZED_USERS = rows.map(row => {
      const cols = row.split(',');
      const fn = (cols[0] || '').trim(), ln = (cols[1] || '').trim();
      return {
        id: (fn + ' ' + ln).toLowerCase(), firstName: fn, lastName: ln,
        name: fn + (ln ? ' ' + ln : ''),
        subjects: (cols[2] || '').trim(),
        active: (cols[3] || '').trim().toUpperCase() === 'YES',
        today: (cols[4] || '').trim(), mtd: (cols[5] || '').trim(),
        ytd: (cols[6] || '').trim(), topics: (cols[7] || '').trim(),
        difficulty: (cols[8] || '').trim(),
        focus: (cols[9] || '').trim(), plan: (cols[10] || '').trim(),
      };
    }).filter(u => u.id.trim() && u.active);
    document.getElementById('loginSubtitle').textContent = 'Enter your name to access tutoring.';
    const saved = localStorage.getItem('tutor_user');
    if (saved) {
      try {
        const user = JSON.parse(saved);
        const match = AUTHORIZED_USERS.find(u => u.id === user.id);
        if (match) showDashboard(match);
        else localStorage.removeItem('tutor_user');
      } catch { localStorage.removeItem('tutor_user'); }
    }
  } catch (e) {
    document.getElementById('loginSubtitle').textContent = 'Could not load user list. Try again later.';
  }
}

function login() {
  const firstInput = document.getElementById('studentFirstName');
  const lastInput = document.getElementById('studentLastName');
  const error = document.getElementById('loginError');
  const firstName = firstInput.value.trim();
  const lastName = lastInput.value.trim();
  const fullId = (firstName + ' ' + lastName).toLowerCase();
  if (!firstName) { error.textContent = 'Please enter your first name.'; error.classList.add('show'); return; }
  const user = AUTHORIZED_USERS.find(u => u.id === fullId);
  if (!user) { error.textContent = 'Name not found. Try again or chat with us to get set up.'; error.classList.add('show'); return; }
  error.classList.remove('show');
  localStorage.setItem('tutor_user', JSON.stringify(user));
  showDashboard(user);
}

function showDashboard(user) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('show');
  document.getElementById('studentName').textContent = user.name;
  document.getElementById('studentInfo').textContent = user.subjects + ' — ' + (user.plan || 'what would you like to study?');

  // Show/hide cards based on user
  document.getElementById('gameCard').style.display = user.firstName === 'Paxton' ? 'block' : 'none';
  document.getElementById('seriesCard').style.display = 'none';
  document.getElementById('seriesCard2').style.display = 'none';
  
  // Josh gets Series 66 & 7 cards
  if (user.firstName === 'Josh') {
    document.getElementById('seriesCard').style.display = 'block';
    document.getElementById('seriesCard2').style.display = 'block';
  }

  if (user.focus) document.getElementById('focusDisplay').textContent = user.focus;

  // Scoreboard
  if (user.today && user.today !== '—') {
    document.getElementById('scoreToday').textContent = user.today;
    const p = extractPercent(user.today);
    document.getElementById('barToday').style.width = Math.min(p, 100) + '%';
    document.getElementById('scoreTodaySub').textContent = user.today;
  }
  if (user.mtd && user.mtd !== '—') {
    document.getElementById('scoreMTD').textContent = user.mtd;
    document.getElementById('barMTD').style.width = Math.min(extractPercent(user.mtd), 100) + '%';
    document.getElementById('scoreMTDSub').textContent = user.mtd;
  }
  if (user.ytd && user.ytd !== '—') {
    document.getElementById('scoreYTD').textContent = user.ytd;
    document.getElementById('barYTD').style.width = Math.min(extractPercent(user.ytd), 100) + '%';
    document.getElementById('scoreYTDSub').textContent = user.ytd;
  }
  if (user.topics) {
    document.getElementById('topicsList').innerHTML = user.topics.split(',').map(t => '<span class="tag">' + t.trim() + '</span>').join(' ');
  }

  // Difficulty badge
  if (user.difficulty && user.difficulty !== '—') {
    const badge = document.getElementById('difficultyBadge');
    badge.textContent = user.difficulty;
    badge.style.display = 'flex';
    badge.className = 'diff-badge';
    const d = user.difficulty;
    if (d.includes('Math 2') || d.includes('Math 3') || d.includes('SAT — Advanced') || d.includes('AP') || d.includes('RN') || d.includes('Series'))
      badge.classList.add('diff-grade10-12');
    else if (d.includes('Math 1') || d.includes('SAT — On Track'))
      badge.classList.add('diff-grade7-9');
    else if (d.includes('Game'))
      badge.classList.add('diff-grade1-3');
    else
      badge.classList.add('diff-grade4-6');
  }

  // Streak
  const ytdPct = extractPercent(user.ytd);
  document.getElementById('streakDisplay').innerHTML = '🔥 Streak ' + (ytdPct >= 90 ? Math.floor(ytdPct / 2) : 0);

  // Quiz history
  if (user.firstName === 'Jiho' || user.firstName === 'Carter' || user.firstName === 'Josh') {
    loadQuizHistory(user.firstName);
  }

  localStorage.setItem('royceai_lead', JSON.stringify({
    name: user.name,
    email: user.name.toLowerCase().replace(' ', '.') + '@student.tutor',
    phone: '000-000-0000',
    timestamp: new Date().toISOString()
  }));
}

async function loadQuizHistory(name) {
  const el = document.getElementById('quizHistory');
  const tbody = document.getElementById('quizHistoryBody');
  el.style.display = 'block';
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">Loading...</td></tr>';
  try {
    const resp = await fetch(HISTORY_API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student: name }),
    });
    const data = await resp.json();
    const sessions = data.sessions || [];
    if (sessions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">No sessions recorded yet</td></tr>';
      return;
    }
    tbody.innerHTML = sessions.slice(-10).reverse().map(s => {
      const pct = s.percent || Math.round(s.correct / s.total * 100);
      const passed = pct >= 80;
      const topics = s.topics ? Object.keys(s.topics).slice(0,2).map(t => '<span class="quiz-topic">' + t.replace(/_/g,' ') + '</span>').join(' ') : '<span class="quiz-topic">general</span>';
      return `<tr>
        <td>${s.date || '—'}</td>
        <td>${s.mode || 'quiz'}</td>
        <td><strong>${s.correct}/${s.total}</strong> (${pct}%)</td>
        <td>${topics}</td>
        <td class="${passed ? 'quiz-pass' : 'quiz-fail'}">${passed ? '✅ Pass' : '❌ Review'}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--red-diff)">Could not load history</td></tr>';
  }
}

function logout() {
  localStorage.removeItem('tutor_user');
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('studentFirstName').value = '';
  document.getElementById('studentLastName').value = '';
}

window.addEventListener('DOMContentLoaded', loadUsers);
</script>
