<script>
const USERS=[{first:"Jiho",last:"Pak",id:"jiho pak",name:"Jiho Pak",subjects:"Math",active:true,today:"88/100 (88%)",mtd:"365/392 (93%)",ytd:"365/392 (93%)",topics:"Combined Session, Exponents Set5",difficulty:"\ud83d\udd25 Math 3",focus:"Radicals, Quadratics, Polynomials",plan:"100 q/day, 80% pass",cards:"math"},{first:"Carter",last:"Koh",id:"carter koh",name:"Carter Koh",subjects:"Math / SAT / Basketball",active:true,today:"\u2014",mtd:"4/4 cal goals hit",ytd:"4/4 cal goals hit",topics:"SAT Concepts, Calorie Tracking",difficulty:"\u26a1 SAT \u2014 On Track",focus:"SAT prep + 4K cal daily + Bench Builder",plan:"4K cal/day, SAT readiness, basketball",cards:"sat,math"},{first:"Angel",last:"Koh",id:"angel koh",name:"Angel Koh",subjects:"RN Training",active:true,today:"\u2014",mtd:"\u2014",ytd:"\u2014",topics:"NCLEX-RN Training",difficulty:"\ud83e\ude7a RN Training \u2014 Active",focus:"NCLEX-RN, Pharmacology, Anatomy",plan:"Exam prep, daily health",cards:"rn"},{first:"Paxton",last:"Koh",id:"paxton koh",name:"Paxton Koh",subjects:"Reading Games",active:true,today:"\u2014",mtd:"\u2014",ytd:"\u2014",topics:"\u2014",difficulty:"\ud83c\udfae Grade 1 \u2014 Game Mode",focus:"Letter Recognition, Phonics, Sight Words",plan:"Daily 15min reading games",cards:"reading"},{first:"Josh",last:"Lucero",id:"josh lucero",name:"Josh Lucero",subjects:"Series 66, 7",active:true,today:"\u2014",mtd:"\u2014",ytd:"\u2014",topics:"\u2014",difficulty:"\u26a1 Series 66/7 \u2014 On Track",focus:"Series 66 (Combined), Series 7",plan:"Practice exams, 80% target",cards:"series66,series7"},{first:"Mason",last:"Min",id:"mason min",name:"Mason Min",subjects:"Baby Play",active:true,today:"\u2014",mtd:"\u2014",ytd:"\u2014",topics:"Sensory Play",difficulty:"\ud83d\udc76 Baby Play \u2014 Sensory",focus:"Sensory, Colors, Sounds",plan:"Daily sensory play",cards:"baby"}];
const H='https://chat-api-tawny-zeta.vercel.app/api/quiz-history';
function e(s){if(!s)return 0;var m=s.match(/(\d+)%/);return m?parseInt(m[1]):0}
function pct(s){if(!s)return 0;var m=s.match(/(\d+)\/(\d+)/);return m?Math.round(parseInt(m[1])/parseInt(m[2])*100):0}
(function L(){document.getElementById('loginSubtitle').textContent='Enter your name.';var s=localStorage.getItem('tutor_user');if(s){try{var u=JSON.parse(s);var m=USERS.find(function(x){return x.id===u.id});if(m)D(m);else localStorage.removeItem('tutor_user')}catch(e){localStorage.removeItem('tutor_user')}}})();
function login(){var fi=document.getElementById('studentFirstName'),li=document.getElementById('studentLastName'),er=document.getElementById('loginError');var fn=fi.value.trim(),ln=li.value.trim(),id=(fn+' '+ln).toLowerCase();if(!fn){er.textContent='Enter your first name.';er.classList.add('show');return}var u=USERS.find(function(x){return x.id===id});if(!u){er.textContent='Name not found.';er.classList.add('show');return}er.classList.remove('show');localStorage.setItem('tutor_user',JSON.stringify(u));D(u)}
function D(u){
  document.getElementById('loginScreen').classList.add('hidden');document.getElementById('dashboard').classList.add('show');
  document.getElementById('studentName').textContent=u.name;document.getElementById('studentInfo').textContent=u.subjects+' \u2014 '+u.plan;
  
  // Show only relevant cards
  var k=u.cards?u.cards.split(','):['math'];
  var cards=document.querySelectorAll('.dash-card');
  cards.forEach(function(c){c.style.display=k.indexOf(c.dataset.subject)>=0?'block':'none'});
  
  // DYNAMIC BUTTONS: style each visible card based on student data
  cards.forEach(function(card){
    if(card.style.display==='block'){
      var btn=card.querySelector('.btn-dynamic');
      if(!btn)return;
      var subj=card.dataset.subject;
      var tp=e(u.today);
      var yp=e(u.ytd);
      
      // Score-based button states
      if(tp>=90){btn.innerHTML='\u26a1 On Fire!';btn.className='btn btn-dynamic btn-fire btn-sm'}
      else if(tp>=80){btn.innerHTML='\u2705 Continue';btn.className='btn btn-dynamic btn-continue btn-sm'}
      else if(tp>0){btn.innerHTML='\ud83d\udcda Review';btn.className='btn btn-dynamic btn-review btn-sm'}
      else if(yp>=90){btn.innerHTML='\ud83d\udd25 Start Quiz';btn.className='btn btn-dynamic btn-hot btn-sm'}
      else{btn.innerHTML='\u26a1 Start Quiz';btn.className='btn btn-dynamic btn-primary btn-sm'}
      
      // Subject-specific overrides for games
      if(subj==='reading'||subj==='baby'){
        btn.innerHTML='\u2b50 Play Now';
        btn.className='btn btn-dynamic '+(subj==='baby'?'btn-baby':'btn-game')+' btn-sm';
      }
    }
  });
  
  if(u.focus)document.getElementById('focusDisplay').textContent=u.focus;
  if(u.today&&u.today!=='\u2014'){document.getElementById('scoreToday').textContent=u.today;var p=e(u.today);document.getElementById('barToday').style.width=Math.min(p,100)+'%';document.getElementById('scoreTodaySub').textContent=u.today}
  if(u.mtd&&u.mtd!=='\u2014'){document.getElementById('scoreMTD').textContent=u.mtd;document.getElementById('barMTD').style.width=Math.min(e(u.mtd),100)+'%';document.getElementById('scoreMTDSub').textContent=u.mtd}
  if(u.ytd&&u.ytd!=='\u2014'){document.getElementById('scoreYTD').textContent=u.ytd;document.getElementById('barYTD').style.width=Math.min(e(u.ytd),100)+'%';document.getElementById('scoreYTDSub').textContent=u.ytd}
  if(u.topics){document.getElementById('topicsList').innerHTML=u.topics.split(',').map(function(t){return '<span class="tag">'+t.trim()+'</span>'}).join(' ')}
  var b=document.getElementById('difficultyBadge');
  if(u.difficulty&&u.difficulty!=='\u2014'){b.textContent=u.difficulty;b.style.display='flex';b.className='diff-badge';var d=u.difficulty;if(d.includes('Math 2')||d.includes('Math 3')||d.includes('SAT \u2014 Advanced')||d.includes('AP')||d.includes('RN')||d.includes('Series'))b.classList.add('diff-grade10-12');else if(d.includes('Math 1')||d.includes('SAT \u2014 On Track'))b.classList.add('diff-grade7-9');else if(d.includes('Game')||d.includes('Baby'))b.classList.add('diff-grade1-3');else b.classList.add('diff-grade4-6')}else b.style.display='none';
  document.getElementById('streakDisplay').innerHTML='\ud83d\udd25 '+(e(u.ytd)>=90?Math.floor(e(u.ytd)/2):0);
  if(u.first==='Jiho'||u.first==='Carter'||u.first==='Josh')Q(u.first);
  localStorage.setItem('royceai_lead',JSON.stringify({name:u.name,email:u.name.toLowerCase().replace(/\s+/g,'.')+'@student.tutor',phone:'000-000-0000',timestamp:new Date().toISOString()}))
}
// Dynamic button CSS
var ds=document.createElement('style');
ds.textContent='.btn-dynamic{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:12px;font-family:Inter,system-ui,sans-serif;font-size:0.85rem;font-weight:700;text-decoration:none;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);border:none;cursor:pointer;position:relative;overflow:hidden;letter-spacing:0.02em}.btn-dynamic::before{content:"";position:absolute;inset:0;border-radius:12px;opacity:0;transition:opacity 0.3s;background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 50%);pointer-events:none}.btn-dynamic:hover::before{opacity:1}.btn-dynamic:hover{animation:btnPop 0.4s cubic-bezier(0.34,1.56,0.64,1);transform:translateY(-3px)}.btn-dynamic:active{transform:translateY(0) scale(0.96)}.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2,#667eea);background-size:200% 200%;color:white;box-shadow:0 4px 15px rgba(102,126,234,0.3),0 0 0 1px rgba(102,126,234,0.3)}.btn-primary:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(102,126,234,0.5),0 0 30px rgba(102,126,234,0.2)}.btn-fire{background:linear-gradient(135deg,#ef4444,#f97316,#ef4444);background-size:200% 200%;color:white;box-shadow:0 4px 15px rgba(239,68,68,0.3),0 0 0 1px rgba(239,68,68,0.3)}.btn-fire:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(239,68,68,0.5),0 0 30px rgba(239,68,68,0.2)}.btn-continue{background:linear-gradient(135deg,#22c55e,#4ade80,#22c55e);background-size:200% 200%;color:white;box-shadow:0 4px 15px rgba(34,197,94,0.3),0 0 0 1px rgba(34,197,94,0.3)}.btn-continue:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(34,197,94,0.5),0 0 30px rgba(34,197,94,0.2)}.btn-review{background:linear-gradient(135deg,#f59e0b,#eab308,#f59e0b);background-size:200% 200%;color:#0a0a0a;box-shadow:0 4px 15px rgba(245,158,11,0.3),0 0 0 1px rgba(245,158,11,0.3)}.btn-review:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(245,158,11,0.5),0 0 30px rgba(245,158,11,0.2)}.btn-hot{background:linear-gradient(135deg,#ef4444,#667eea,#ef4444);background-size:200% 200%;color:white;box-shadow:0 4px 15px rgba(239,68,68,0.3),0 0 0 1px rgba(239,68,68,0.3)}.btn-hot:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(239,68,68,0.5),0 0 30px rgba(239,68,68,0.2)}.btn-game{background:linear-gradient(135deg,#eab308,#facc15,#eab308);background-size:200% 200%;color:#0a0a0a;font-weight:800;box-shadow:0 4px 15px rgba(234,179,8,0.4),0 0 0 1px rgba(234,179,8,0.3)}.btn-game:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(234,179,8,0.6),0 0 30px rgba(234,179,8,0.2)}.btn-baby{background:linear-gradient(135deg,#ff6b9d,#ff85ab,#ff6b9d);background-size:200% 200%;color:white;font-weight:800;box-shadow:0 4px 15px rgba(255,107,157,0.3),0 0 0 1px rgba(255,107,157,0.3)}.btn-baby:hover{animation:btnPop 0.4s,btnShine 2s linear infinite;background-position:100% center;box-shadow:0 6px 25px rgba(255,107,157,0.5),0 0 30px rgba(255,107,157,0.2)}.btn-sm{padding:9px 20px;font-size:0.85rem}';
document.head.appendChild(ds);
async function Q(n){var el=document.getElementById('quizHistory'),tb=document.getElementById('quizHistoryBody');el.style.display='block';tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">Loading...</td></tr>';try{var r=await fetch(H,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student:n})});var d=await r.json(),ss=d.sessions||[];if(!ss.length){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-secondary)">No sessions yet</td></tr>';return}tb.innerHTML=ss.slice(-10).reverse().map(function(s){var p=s.percent||Math.round(s.correct/s.total*100),pa=p>=80;var tp=s.topics?Object.keys(s.topics).slice(0,2).map(function(t){return '<span class="quiz-topic">'+t.replace(/_/g,' ')+'</span>'}).join(' '):'<span class="quiz-topic">general</span>';return '<tr><td>'+(s.date||'\u2014')+'</td><td>'+(s.mode||'quiz')+'</td><td><strong>'+s.correct+'/'+s.total+'</strong> ('+p+'%)</td><td>'+tp+'</td><td class="'+(pa?'quiz-pass':'quiz-fail')+'">'+(pa?'\u2705 Pass':'\u274c Review')+'</td></tr>'}).join('')}catch(e){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--red-diff)">Could not load history</td></tr>'}}
function logout(){localStorage.removeItem('tutor_user');document.getElementById('dashboard').classList.remove('show');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('studentFirstName').value='';document.getElementById('studentLastName').value=''}
</script>
