function render() {
  const m = document.getElementById('fModel').value;
  const p = parseFloat(document.getElementById('fPrice').value) || Infinity;
  const t = document.getElementById('fText').value.toLowerCase().trim();
  const s = document.getElementById('fSort').value;
  let rows = data.filter(v => {
    if (m && v.model !== m) return false;
    if (v.price && v.price > p) return false;
    if (t) {
      const blob = (v.title + ' ' + v.model + ' ' + (v.year||'')).toLowerCase();
      if (!blob.includes(t)) return false;
    }
    return true;
  });
  if (s === 'price') rows.sort((a,b) => (a.price||1e18)-(b.price||1e18));
  if (s === 'price-desc') rows.sort((a,b) => (b.price||0)-(a.price||0));
  if (s === 'model') rows.sort((a,b) => a.model.localeCompare(b.model));
  document.getElementById('count').textContent = rows.length + ' vehicle' + (rows.length===1?'':'s');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('grid').innerHTML = rows.map(v => {
    const price = v.price ? '$' + v.price.toLocaleString() : 'Price on request';
    const badge = v.status ? '<span class="badge badge-stock">IN STOCK</span>' : '';
    const model = '<span class="badge badge-model">' + (v.model||'') + '</span>';
    return '<div class="card">' +
      '<div>' + model + ' ' + badge + '</div>' +
      '<h3>' + v.title + '</h3>' +
      '<div class="price">' + price + '</div>' +
      '<div class="meta">' + (v.year||'') + '</div>' +
      (v.url ? '<div class="url"><a href="' + v.url + '" target="_blank" rel="noopener">View on dealer site ↗</a></div>' : '') +
      '</div>';
  }).join('');
}
['fModel','fPrice','fText','fSort'].forEach(id => document.getElementById(id).addEventListener('input', render));
document.getElementById('fModel').innerHTML = '<option value="">All</option>' +
  [...new Set(data.map(v => v.model))].filter(Boolean).sort().map(x => '<option>' + x + '</option>').join('');
render();
